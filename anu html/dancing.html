*Dancing party HTML code* <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dancing Clown Party</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
      background: radial-gradient(circle at top, #2d1b4e, #0f0f1a 70%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      position: relative;
    }

    /* Disco lights */
    .light {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: pulse 3s infinite alternate;
    }

    .light1 { background: #ff00ff; top: 10%; left: 10%; }
    .light2 { background: #00ffff; top: 20%; right: 15%; }
    .light3 { background: #00ff66; top: 5%; left: 45%; }

    @keyframes pulse {
      from { transform: scale(0.8); opacity: 0.25; }
      to   { transform: scale(1.2); opacity: 0.45; }
    }

    /* Stage */
    .stage {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 130px;
      background: linear-gradient(to top, #111, #222);
      box-shadow: 0 -10px 30px rgba(255,255,255,0.05);
    }

    .container {
      display: flex;
      align-items: flex-end;
      gap: 70px;
      z-index: 2;
      margin-bottom: 95px;
    }

    .character {
      position: relative;
      width: 110px;
      height: 280px;
      animation: bounce 1s infinite ease-in-out alternate;
    }

    .character.left {
      animation-delay: 0.2s;
    }

    .character.right {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      from { transform: translateY(0) rotate(-2deg); }
      to   { transform: translateY(-18px) rotate(2deg); }
    }

    /* Head */
    .head {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #ffd9b3;
      position: absolute;
      top: 0;
      left: 20px;
      z-index: 2;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,0.08);
    }

    /* Hair */
    .hair {
      position: absolute;
      width: 82px;
      height: 40px;
      background: #32cd32;
      border-radius: 50px 50px 20px 20px;
      top: -8px;
      left: 14px;
      z-index: 3;
    }

    .girl .hair {
      background: #ff69b4;
      height: 55px;
      border-radius: 50px 50px 40px 40px;
    }

    /* Face */
    .eye {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #111;
      border-radius: 50%;
      top: 28px;
    }

    .eye.left-eye { left: 22px; }
    .eye.right-eye { right: 22px; }

    .smile {
      position: absolute;
      width: 26px;
      height: 14px;
      border-bottom: 4px solid crimson;
      border-radius: 0 0 30px 30px;
      top: 42px;
      left: 22px;
    }

    /* Body */
    .body {
      position: absolute;
      top: 65px;
      left: 20px;
      width: 70px;
      height: 95px;
      border-radius: 20px;
      background: linear-gradient(to bottom, purple 50%, green 50%);
    }

    .girl .body {
      background: linear-gradient(to bottom, #ff4da6, #ff99cc);
      border-radius: 20px 20px 30px 30px;
    }

    /* Arms */
    .arm {
      position: absolute;
      width: 16px;
      height: 75px;
      background: #ffd9b3;
      top: 78px;
      border-radius: 10px;
      transform-origin: top center;
      animation: danceArms 0.8s infinite alternate ease-in-out;
    }

    .arm.left-arm { left: 5px; transform: rotate(35deg); }
    .arm.right-arm { right: 5px; transform: rotate(-35deg); }

    @keyframes danceArms {
      from { transform: rotate(25deg); }
      to   { transform: rotate(-35deg); }
    }

    .right-arm {
      animation-name: danceArms2;
    }

    @keyframes danceArms2 {
      from { transform: rotate(-25deg); }
      to   { transform: rotate(35deg); }
    }

    /* Legs */
    .leg {
      position: absolute;
      width: 18px;
      height: 90px;
      background: #222;
      top: 155px;
      border-radius: 10px;
      transform-origin: top center;
      animation: danceLegs 0.8s infinite alternate ease-in-out;
    }

    .leg.left-leg { left: 28px; }
    .leg.right-leg { right: 28px; }

    @keyframes danceLegs {
      from { transform: rotate(18deg); }
      to   { transform: rotate(-18deg); }
    }

    .right-leg {
      animation-name: danceLegs2;
    }

    @keyframes danceLegs2 {
      from { transform: rotate(-18deg); }
      to   { transform: rotate(18deg); }
    }

    /* Shoes */
    .shoe {
      position: absolute;
      width: 26px;
      height: 12px;
      background: #000;
      border-radius: 10px;
      bottom: -2px;
      left: -4px;
    }

    /* Title */
    .title {
      position: absolute;
      top: 30px;
      width: 100%;
      text-align: center;
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 0 0 15px #ff00ff, 0 0 25px #00ffff;
      letter-spacing: 2px;
      z-index: 2;
    }

    /* Music bars */
    .bars {
      position: absolute;
      bottom: 145px;
      display: flex;
      gap: 6px;
      z-index: 1;
    }

    .bar {
      width: 10px;
      height: 40px;
      background: #00ffff;
      animation: bars 0.7s infinite alternate;
      border-radius: 5px;
    }

    .bar:nth-child(2) { animation-delay: 0.2s; height: 55px; }
    .bar:nth-child(3) { animation-delay: 0.4s; height: 70px; }
    .bar:nth-child(4) { animation-delay: 0.1s; height: 50px; }
    .bar:nth-child(5) { animation-delay: 0.3s; height: 60px; }

    @keyframes bars {
      from { transform: scaleY(0.6); opacity: 0.7; }
      to   { transform: scaleY(1.3); opacity: 1; }
    }

    @media (max-width: 768px) {
      .container {
        gap: 25px;
        transform: scale(0.82);
        margin-bottom: 85px;
      }

      .title {
        font-size: 1.5rem;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>

  <div class="title">🎉 Anu's wedding party dance 🎉</div>

  <div class="light light1"></div>
  <div class="light light2"></div>
  <div class="light light3"></div>

  <div class="bars">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <div class="container">
    <!-- Girl Left -->
    <div class="character girl left">
      <div class="hair"></div>
      <div class="head">
        <div class="eye left-eye"></div>
        <div class="eye right-eye"></div>
        <div class="smile"></div>
      </div>
      <div class="body"></div>
      <div class="arm left-arm"></div>
      <div class="arm right-arm"></div>
      <div class="leg left-leg"><div class="shoe"></div></div>
      <div class="leg right-leg"><div class="shoe"></div></div>
    </div>

    <!-- Center Clown -->
    <div class="character">
      <div class="hair"></div>
      <div class="head">
        <div class="eye left-eye"></div>
        <div class="eye right-eye"></div>
        <div class="smile"></div>
      </div>
      <div class="body"></div>
      <div class="arm left-arm"></div>
      <div class="arm right-arm"></div>
      <div class="leg left-leg"><div class="shoe"></div></div>
      <div class="leg right-leg"><div class="shoe"></div></div>
    </div>

    <!-- Girl Right -->
    <div class="character girl right">
      <div class="hair"></div>
      <div class="head">
        <div class="eye left-eye"></div>
        <div class="eye right-eye"></div>
        <div class="smile"></div>
      </div>
      <div class="body"></div>
      <div class="arm left-arm"></div>
      <div class="arm right-arm"></div>
      <div class="leg left-leg"><div class="shoe"></div></div>
      <div class="leg right-leg"><div class="shoe"></div></div>
    </div>
  </div>

  <div class="stage"></div>

</body>
</html>
